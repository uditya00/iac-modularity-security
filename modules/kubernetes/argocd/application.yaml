apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stratomesh
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/uditya00/iac-modularity-security.git
    targetRevision: stratomesh-upgrade
    path: modules/kubernetes/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: stratomesh
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
