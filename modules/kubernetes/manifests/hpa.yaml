apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stratomesh-backend-hpa
  namespace: stratomesh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stratomesh-backend

  minReplicas: 2
  maxReplicas: 10

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70

---
