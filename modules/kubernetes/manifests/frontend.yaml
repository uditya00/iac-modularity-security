apiVersion: apps/v1
kind: Deployment
metadata:
  name: stratomesh-frontend
  namespace: stratomesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stratomesh-frontend
  template:
    metadata:
      labels:
        app: stratomesh-frontend
    spec:
      containers:
        - name: frontend
          image: stratomesh-frontend:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          env:
            - name: BACKEND_URL
              value: "http://stratomesh-backend:3000"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: stratomesh-frontend
  namespace: stratomesh
spec:
  type: ClusterIP
  selector:
    app: stratomesh-frontend
  ports:
    - port: 8080
      targetPort: 8080