apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stratomesh-default-deny
  namespace: stratomesh
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stratomesh-dns
  namespace: stratomesh
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stratomesh-frontend-to-backend
  namespace: stratomesh
spec:
  podSelector:
    matchLabels:
      app: stratomesh-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: stratomesh-frontend
      ports:
        - protocol: TCP
          port: 3000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stratomesh-frontend-egress
  namespace: stratomesh
spec:
  podSelector:
    matchLabels:
      app: stratomesh-frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: stratomesh-backend
      ports:
        - protocol: TCP
          port: 3000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stratomesh-backend-to-database
  namespace: stratomesh
spec:
  podSelector:
    matchLabels:
      app: stratomesh-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: stratomesh-backend
      ports:
        - protocol: TCP
          port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stratomesh-backend-egress
  namespace: stratomesh
spec:
  podSelector:
    matchLabels:
      app: stratomesh-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: stratomesh-db
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stratomesh-frontend-ingress
  namespace: stratomesh
spec:
  podSelector:
    matchLabels:
      app: stratomesh-frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
